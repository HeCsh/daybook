name: Update feeds
# Refreshes Real Madrid and F1 data every two hours, and on demand from the Actions tab.
on:
  schedule:
    - cron: '23 */2 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-feeds
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update-feeds.mjs
      - name: Commit when the data changed
        run: |
          if [ -n "$(git status --porcelain feeds.json)" ]; then
            git config user.name "daybook-bot"
            git config user.email "daybook-bot@users.noreply.github.com"
            git add feeds.json
            git commit -m "Update feeds"
            git push
          else
            echo "feeds.json unchanged"
          fi
